<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prudential Center Lights Tonight</title>
  <link rel="stylesheet" href="style.css">

  <!-- SEO -->
  <meta name="description" content="Find out what tonight's Prudential Center tower lighting is in Boston, MA. Updated every 6 hours.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">

<body>
  <main>
    <div id="loading" class="state">
      <p class="dim">Loading&hellip;</p>

    <section id="error" class="state" hidden>
      <p class="dim">UNABLE TO LOAD DATA</p>
    </section>

  <footer>
    <p id="generated-at" class="meta"></p>
    <p class="meta">Data from <a href="https://www.prudentialcenter.com/experiences/events/">prudentialcenter.com</a></p>

  <script src="app.js"></script>
